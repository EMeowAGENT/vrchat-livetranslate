name: Release

# 打 v* 标签 → 在 Windows 上真打包一次单文件 exe → 建 Release 并把 exe 当附件传上去。
# 为什么放 CI 而不是本机手工传：手工那次没人能复现「这个 exe 到底是哪个 commit 打的」，
# 而这里 tag 与包内 __version__ 会先对一次账，产物还带 SHA256。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # 手动跑一次只产出 artifact（不建 release）

permissions:
  contents: write               # 建 release / 传附件需要

# ⚠️ 必须开 UTF-8：Windows runner 的 stdout 默认是 cp1252，脚本里带 emoji/中文的 print
# 会 UnicodeEncodeError 直接打挂这一步（CI 上实测过 check_no_secrets.py 崩在「✅」）。
env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 打包脚本会读 git HEAD 做版本溯源

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # 与 README 要求一致（3.12 未测）

      - name: 对账 tag 与包内版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path vlt/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          $py = $m.Matches[0].Groups[1].Value
          Write-Host "tag=$tag  包内 __version__=$py"
          if ($tag -ne $py) {
            Write-Error "tag 与 vlt/__init__.py 的 __version__ 不一致：先改代码再打 tag"
            exit 1
          }

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.6"

      - name: 打包单文件 exe
        # --no-verify：打完自带的自检要真 API key + 联网，CI 里没有 → 跳过
        run: python scripts/build_exe.py --no-verify

      - name: 自检产物（存在性 / 大小 / 图标资源）
        shell: pwsh
        run: |
          $exe = "dist/VRChatLiveTranslate.exe"
          if (-not (Test-Path $exe)) { Write-Error "没找到产物 $exe"; exit 1 }
          $f = Get-Item $exe
          Write-Host ("产物：{0}  {1:N1} MB" -f $f.Name, ($f.Length / 1MB))
          if ($f.Length -lt 20MB) { Write-Error "产物体积异常（<20MB），大概率没打全"; exit 1 }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # ⚠️ 过渡期必须继续产出 SHA256SUMS.txt：**≤ v0.2.0 的老客户端把「exe + SHA256SUMS.txt
          #    两个附件」写死在更新检查里**，缺一个就静默地永远查不到新版本（v0.2.0 → v0.2.1 实测踩到）。
          #    新客户端优先用 GitHub 的 asset digest，这个文件纯粹给老客户端兜底。
          "$hash  VRChatLiveTranslate.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Write-Host ("sha256：{0}" -f $hash)

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: VRChatLiveTranslate-exe
          path: |
            dist/VRChatLiveTranslate.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 建 Release 并附上 exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # ⚠️ 这一条只存在于「房间/测试」分支：把发布标成 pre-release，
          #    否则 GitHub 的 /releases/latest 会把它当成最新正式版推给所有稳定版用户
          #    （客户端的更新检查用的就是 /releases/latest，它天然排除 prerelease）。
          #    这个分支将来转正式版时，把 prerelease 改回 false。
          prerelease: true
          # 自动附加「本版更新」：把上个 tag 以来的提交按分类列出来，
          # 免得每次发版的说明都是同一段静态文案（v0.0.1 → v0.0.2 实测过这个坑）。
          generate_release_notes: true
          body: |
            ## VRChat 实时同传 ${{ github.ref_name }}（测试版）

            > ⚠️ **这是测试版，不是正式版。** 它带一个还在验证中的新功能（多人房间 · 文字中继），
            > 跨机/跨网络的实测数据还不完整。只想稳定用的话请装正式版 **v0.3.0**。
            > 测试版的发布**不会被客户端自动更新推送给别人**（pre-release 不参与「最新版」判断）。

            **下载附件里的 `VRChatLiveTranslate.exe`（单文件、免安装、无控制台），双击即用。**
            校验值看附件旁的 `sha256:`；`SHA256SUMS.txt` 是给老客户端识别更新用的，手动下载不需要它。

            ### 用它之前需要什么
            - Windows 10/11
            - **一个阿里云百炼 API key**（自备，按量计费）：界面「⚙ 设置」粘贴保存，或设环境变量 `DASHSCOPE_API_KEY`
            - VRChat 设置里打开 **OSC**（`OSC enabled: True`）、chat bubble visibility 设为 **Everyone**

            ### 这版新增：多人房间（文字中继）

            **几个都装了这个版本的人，进同一个「房间」，就能在各自的手腕屏上看到彼此说的话。**
            适合「语音频道被本地玩家语言占掉、几个人之间不方便说话」的场合。

            - 主界面多了第三行「房间」：勾上、填**同一个房间码**（8 位，不含容易念错的 `I/L/O/U`）、填个昵称即可；勾选与填写会即时存进 `config.yaml`
            - **只广播你自己说的话**（本机识别出的原文）。采集游戏声音那条腿（loopback）被显式排除，
              不会把别人说话的声音二次转播出去，也不会形成回环
            - 手腕屏上**按人分色 + 显示昵称**，几个人同时说话也能一眼分清谁在说；聊天区同样显示
            - **默认只显示文字、不出声**：TTS 回灌的接口已经预留，本版未开放
            - 服务端是 Cloudflare Worker + 每房间一个 Durable Object，**只搬文字**：不翻译、不落库、房间空了自动回收

            ### 怎么用
            - 我说 → **chatbox 气泡** / 房间里其他人的手腕屏
            - 别人说 → **VR 手腕屏**
            - 打字 → 不想开麦时用键盘代替麦克风
            - 未配置 API key 时，主界面右上角会变成「一键开通百炼」的入口

            完整说明见仓库 [README](https://github.com/nixi-agent/vrchat-livetranslate#readme)。
          files: |
            dist/VRChatLiveTranslate.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
